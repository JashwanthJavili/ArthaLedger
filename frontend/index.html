    <title>ArthaLedger - Where every rupee has meaning.</title>
    <script>
      try {
        // Light by default; dark only if chosen in Settings. Landing page is always light.
        var dark = localStorage.getItem('sl_dark') === 'true' && location.pathname !== '/';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#26282E' : '#FAF8F5');
        if (dark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
      // Installed app, first open this session: paint the branded splash
      // straight from the HTML so it is the very first thing on screen.
      try {
        var installed = window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true || document.referrer.indexOf('android-app://') === 0;
        if (installed && !sessionStorage.getItem('al_visited')) document.documentElement.classList.add('boot-splash');
      } catch (e) {}
    </script>
    <style>
      /* Launch screen: the same picture the Android app shows while starting
         (PWABuilder "Icon URL", 300dp, always light like Android's frame), embedded so it is on the very first
         frame. It lives outside #root, so React never re-creates it:
         SplashScreen.jsx only fills the gold line and fades it away. */
      #boot-splash { display: none; }
      html.boot-splash #boot-splash {
        position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center;
        background: #FAF8F5;
        transition: opacity 520ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      #boot-splash .bx { position: relative; width: 300px; height: 300px; transition: transform 620ms cubic-bezier(0.16, 1, 0.3, 1); }
      #boot-splash img { width: 300px; height: 300px; display: block; }
      #boot-splash .bar { position: absolute; left: 118px; top: 250px; width: 64px; height: 2px; border-radius: 2px; overflow: hidden;
        background: rgba(0,0,0,0.06); opacity: 0; transition: opacity 300ms ease; }
      #boot-splash .bar i { display: block; height: 100%; border-radius: 2px; background: #C5A059;
        transform: scaleX(0); transform-origin: left; transition: transform 1000ms cubic-bezier(0.4, 0, 0.2, 1); }
      #boot-splash.run .bar { opacity: 1; }
      #boot-splash.run .bar i { transform: scaleX(1); }
      /* Exit: the picture drifts slightly closer while the screen dissolves */
      #boot-splash.out { opacity: 0; pointer-events: none; }
      #boot-splash.out .bx { transform: scale(1.06); }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash, #boot-splash .bx, #boot-splash .bar i { transition-duration: 1ms; }
      }
    </style>
