<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <!-- App UI: stop Chrome's "Translate this page" prompt -->
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF8F5" />
    <meta name="description" content="ArthaLedger - Where every rupee has meaning." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ArthaLedger" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>ArthaLedger - Where every rupee has meaning.</title>
    <script>
      try {
        var saved = localStorage.getItem('sl_dark');
        var dark = saved === null
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : saved === 'true';
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#26282E' : '#FAF8F5');
        if (dark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
      // Installed app, first open this session: paint the branded splash
      // straight from the HTML so it is the very first thing on screen.
      try {
        var installed = window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true || document.referrer.indexOf('android-app://') === 0;
        if (installed && !sessionStorage.getItem('al_visited')) document.documentElement.classList.add('boot-splash');
      } catch (e) {}
    </script>
    <style>
      /* Same picture the Android app shows while starting (PWABuilder "Icon URL"),
         at the same size, so the hand-off is invisible. See SplashScreen.jsx. */
      #boot-splash { display: none; }
      html.boot-splash #boot-splash {
        position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center;
        background: #FAF8F5;
      }
      html.dark.boot-splash #boot-splash { background: #26282E; }
      #boot-splash img { width: 300px; height: 300px; }
      #boot-splash .dk, html.dark #boot-splash .lt { display: none; }
      html.dark #boot-splash .dk { display: block; }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot-splash" aria-hidden="true">
      <img class="lt" src="/icons/splash-1024.png" alt="" />
      <img class="dk" src="/icons/splash-dark-1024.png" alt="" />
    </div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
